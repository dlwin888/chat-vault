
services:
  db:
    image: postgres:16-alpine
    container_name: chatvault_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: chatvault
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    image: docker.1ms.run/library/python:3.12-slimwq
    build: ./chat-vault-backend
    container_name: chatvault_backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://admin:${DB_PASSWORD}@db:5432/chatvault
      - ZHIPUAI_API_KEY=${ZHIPUAI_API_KEY}
    depends_on:
      - db
    restart: always
    ports:
      - "127.0.0.1:8002:8001"

  frontend:
    image: docker.1ms.run/library/node:22-alpine
    build:
      context: ./chat-vault-frontend
      args:
        - BACKEND_URL=http://backend:8001
    container_name: chatvault_frontend
    environment:
      - BACKEND_URL=http://backend:8001  # 👈 让 Next.js 容器内部找 backend
    depends_on:
      - backend
    restart: always
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  pgdata:
